name: Deploy Website to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site artifact (webpage + highlighted assets)
        run: |
          set -e
          mkdir -p dist
          rsync -a --delete webpage/ dist/
          # Expose CE231 highlighted HTMLs under /CEE231_SolidMechanics/highlighted_htmls
          if [ -d "CEE231_SolidMechanics/highlighted_htmls" ]; then
            mkdir -p dist/CEE231_SolidMechanics/highlighted_htmls
            rsync -a CEE231_SolidMechanics/highlighted_htmls/ dist/CEE231_SolidMechanics/highlighted_htmls/
          fi
          # Expose CE225 highlighted PDFs under /CEE225_Dynamics/highlighted_pdfs
          if [ -d "CEE225_Dynamics/highlighted_pdfs" ]; then
            mkdir -p dist/CEE225_Dynamics/highlighted_pdfs
            rsync -a "CEE225_Dynamics/highlighted_pdfs/" dist/CEE225_Dynamics/highlighted_pdfs/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

