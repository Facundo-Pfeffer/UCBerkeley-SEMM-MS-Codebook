name: Deploy Website to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site artifact (webpage + highlighted assets)
        run: |
          set -e
          mkdir -p dist
          rsync -a --delete webpage/ dist/
          # Expose ALL highlighted_htmls folders preserving their relative paths
          while IFS= read -r -d '' dir; do
            # strip leading ./ if present
            rel="${dir#./}"
            mkdir -p "dist/${rel}"
            rsync -a "${dir}/" "dist/${rel}/"
          done < <(find . -type d -name highlighted_htmls -print0)

          # Expose ALL highlighted_pdfs folders preserving their relative paths
          while IFS= read -r -d '' dir; do
            rel="${dir#./}"
            mkdir -p "dist/${rel}"
            rsync -a "${dir}/" "dist/${rel}/"
          done < <(find . -type d -name highlighted_pdfs -print0)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

